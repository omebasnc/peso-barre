<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peso Barre</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peso Barre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16191d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
/* Layout: una colonna stretta da officina — scelta materiale, profilo, quote, risultato in evidenza */
:root{
  --bg:#e9ecef;
  --panel:#f7f8f9;
  --ink:#16191d;
  --muted:#5b6470;
  --line:#c9cfd6;
  --accent:#1d47c4;       /* blu da tracciatura */
  --accent-ink:#ffffff;
  --result:#16191d;
  --result-ink:#f2f4f6;
  --result-muted:#9aa4b0;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#1a1e24; --ink:#e6e9ed; --muted:#8f99a6; --line:#2e353e;
    --accent:#5b84ff; --accent-ink:#0b0e14; --result:#000000; --result-ink:#f2f4f6; --result-muted:#8f99a6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1e24; --ink:#e6e9ed; --muted:#8f99a6; --line:#2e353e;
  --accent:#5b84ff; --accent-ink:#0b0e14; --result:#000000; --result-ink:#f2f4f6; --result-muted:#8f99a6;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 28px);
  margin:0;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
header small{font-family:var(--font-num);font-size:12px;color:var(--muted)}

.label{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* Materiale */
.select-wrap{position:relative}
select{
  width:100%;appearance:none;-webkit-appearance:none;
  font:500 17px/1.2 var(--font-body);color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 44px 14px 14px;
}
.select-wrap::after{
  content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;margin-top:-7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none;
}
.density{margin-top:6px;font-family:var(--font-num);font-size:13px;color:var(--muted)}
.density b{color:var(--ink);font-weight:500}

/* Profilo */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:10px 2px 8px;font:600 13px var(--font-display);letter-spacing:.03em;text-transform:uppercase;cursor:pointer;min-width:0;
}
.seg button svg{width:30px;height:30px}
.seg button svg *{fill:none;stroke:currentColor;stroke-width:2}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Quote */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.inp{position:relative}
.inp input{
  width:100%;font:500 22px var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 48px 11px 12px;
}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:400 14px var(--font-num);color:var(--muted);pointer-events:none}
.field.bad input{border-color:#c43b1d}

/* Risultato */
.result{
  background:var(--result);color:var(--result-ink);border-radius:14px;padding:18px 18px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.result .label{color:var(--result-muted);margin:0}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big output{font:600 52px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big .u{font:600 22px var(--font-display);color:var(--result-muted)}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;border-top:1px solid #ffffff22;padding-top:10px}
.rows dt{color:var(--result-muted)}
.rows dd{margin:0;text-align:right}
.spec{font-family:var(--font-num);font-size:12px;color:var(--result-muted);overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin:0;max-width:60ch}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Peso Barre</h1>
    <small>kg · mm</small>
  </header>

  <section>
    <p class="label"><label for="mat">Materiale</label></p>
    <div class="select-wrap"><select id="mat"></select></div>
    <div class="density" id="dens"></div>
  </section>

  <section>
    <p class="label">Profilo</p>
    <div class="seg" role="group" aria-label="Profilo barra">
      <button type="button" data-shape="tonda" aria-pressed="true">
        <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="13"/></svg>Tonda
      </button>
      <button type="button" data-shape="quadra" aria-pressed="false">
        <svg viewBox="0 0 34 34"><rect x="5" y="5" width="24" height="24"/></svg>Quadra
      </button>
      <button type="button" data-shape="piatta" aria-pressed="false">
        <svg viewBox="0 0 34 34"><rect x="3" y="11" width="28" height="12"/></svg>Piatta
      </button>
      <button type="button" data-shape="esagono" aria-pressed="false">
        <svg viewBox="0 0 34 34"><polygon points="10,4.5 24,4.5 31,17 24,29.5 10,29.5 3,17"/></svg>Esagono
      </button>
      <button type="button" data-shape="tubo" aria-pressed="false">
        <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="13"/><circle cx="17" cy="17" r="8"/></svg>Tubo
      </button>
    </div>
  </section>

  <section>
    <p class="label">Quote</p>
    <div class="fields" id="fields"></div>
  </section>

  <section class="result" aria-live="polite">
    <p class="label">Peso totale</p>
    <div class="big"><output id="tot">0</output><span class="u">kg</span></div>
    <dl class="rows">
      <dt>Peso per pezzo</dt><dd id="pz">–</dd>
      <dt>Peso al metro</dt><dd id="km">–</dd>
      <dt>Sezione</dt><dd id="sez">–</dd>
    </dl>
    <div class="spec" id="spec"></div>
  </section>

  <p class="note">Funziona anche senza connessione. Peso teorico calcolato su dimensioni nominali. I valori di peso specifico sono medi per la famiglia di materiale: per la singola lega fa fede la scheda del fornitore.</p>
</div>

<script>
// Pesi specifici in kg/dm³ (= g/cm³)
const MATERIALI = [
  {g:"Acciai", n:"Acciaio al carbonio (C45, S235, 11SMnPb37)", d:7.85},
  {g:"Acciai", n:"Acciaio legato (42CrMo4, 39NiCrMo3)", d:7.85},
  {g:"Acciai", n:"Acciaio da cementazione (16MnCr5, 18NiCrMo5)", d:7.85},
  {g:"Acciai", n:"Acciaio per cuscinetti 100Cr6", d:7.81},
  {g:"Acciai", n:"Acciaio per utensili (X210Cr12, 40CrMnMo7)", d:7.75},
  {g:"Acciai", n:"Acciaio inox 17-4 PH", d:7.78},
  {g:"Acciai", n:"Acciaio inox duplex 2205", d:7.80},
  {g:"Acciai", n:"Acciaio inox AISI 303 / 304", d:7.93},
  {g:"Acciai", n:"Acciaio inox AISI 316 / 316L", d:8.00},
  {g:"Acciai", n:"Acciaio inox AISI 420 / 430", d:7.70},
  {g:"Ghise", n:"Ghisa grigia (EN-GJL)", d:7.20},
  {g:"Ghise", n:"Ghisa sferoidale (EN-GJS)", d:7.10},
  {g:"Alluminio", n:"Alluminio 6082 (Anticorodal)", d:2.70},
  {g:"Alluminio", n:"Alluminio 2011 (Avional da torneria)", d:2.84},
  {g:"Alluminio", n:"Alluminio 7075 (Ergal)", d:2.81},
  {g:"Alluminio", n:"Alluminio 5083 (Peraluman)", d:2.66},
  {g:"Rame e leghe", n:"Ottone CW614N (OT58)", d:8.47},
  {g:"Rame e leghe", n:"Bronzo CuSn (fosforoso)", d:8.80},
  {g:"Rame e leghe", n:"Bronzo all'alluminio CuAl10", d:7.60},
  {g:"Rame e leghe", n:"Rame Cu-ETP", d:8.96},
  {g:"Altri", n:"Titanio Gr. 2", d:4.51},
  {g:"Altri", n:"Titanio Gr. 5 (Ti6Al4V)", d:4.43},
  {g:"Altri", n:"Nichel / Inconel 718", d:8.19},
  {g:"Altri", n:"Magnesio AZ31", d:1.78},
  {g:"Altri", n:"Zinco", d:7.14},
  {g:"Altri", n:"Piombo", d:11.34},
  {g:"Altri", n:"Tungsteno", d:19.30}
];

const FORME = {
  tonda:  [{k:"d", l:"Diametro Ø"}, {k:"L", l:"Lunghezza"}],
  quadra: [{k:"a", l:"Lato"}, {k:"L", l:"Lunghezza"}],
  piatta: [{k:"b", l:"Larghezza"}, {k:"s", l:"Spessore"}, {k:"L", l:"Lunghezza"}],
  esagono:[{k:"h", l:"Chiave (tra le facce)"}, {k:"L", l:"Lunghezza"}],
  tubo:   [{k:"D", l:"Ø esterno"}, {k:"t", l:"Spessore parete"}, {k:"L", l:"Lunghezza"}]
};

const state = {mat:0, shape:"tonda", v:{d:"50", a:"40", b:"60", s:"10", h:"36", D:"60", t:"5", L:"1000", n:"1"}};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem("pesobarre") || "null");
    if(s){ Object.assign(state.v, s.v||{}); if(FORME[s.shape]) state.shape=s.shape; if(MATERIALI[s.mat]) state.mat=s.mat; }
  }catch(e){}
}
function save(){ try{ localStorage.setItem("pesobarre", JSON.stringify(state)); }catch(e){} }

const nf = (x, dig) => new Intl.NumberFormat("it-IT",{minimumFractionDigits:dig, maximumFractionDigits:dig}).format(x);
const num = s => { const x = parseFloat(String(s).replace(",", ".")); return isFinite(x) && x > 0 ? x : NaN; };

const $ = id => document.getElementById(id);

function buildSelect(){
  const sel = $("mat"); let grp = null, og = null;
  MATERIALI.forEach((m,i)=>{
    if(m.g!==grp){ og=document.createElement("optgroup"); og.label=m.g; sel.appendChild(og); grp=m.g; }
    const o=document.createElement("option"); o.value=i; o.textContent=m.n; og.appendChild(o);
  });
  sel.value = state.mat;
  sel.addEventListener("change", ()=>{ state.mat=+sel.value; calc(); });
}

function buildFields(){
  const box = $("fields"); box.innerHTML="";
  const list = [...FORME[state.shape], {k:"n", l:"Quantità pezzi", u:"pz"}];
  list.forEach(f=>{
    const w=document.createElement("div");
    w.className="field";
    const id="f_"+f.k;
    w.innerHTML = `<label for="${id}">${f.l}</label><div class="inp"><input id="${id}" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span>${f.u||"mm"}</span></div>`;
    const inp = w.querySelector("input");
    inp.value = state.v[f.k];
    inp.addEventListener("input", ()=>{ state.v[f.k]=inp.value; calc(); });
    inp.addEventListener("focus", ()=>inp.select());
    box.appendChild(w);
  });
  // piatta: 3 quote + quantità = griglia 2x2 piena; tonda/quadra: 3 campi → quantità a tutta riga
  if(list.length % 2) box.lastChild.classList.add("full");
}

function setShape(sh){
  state.shape=sh;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.shape===sh));
  buildFields(); calc();
}

function calc(){
  const m = MATERIALI[state.mat], v = state.v;
  $("dens").innerHTML = `Peso specifico <b>${nf(m.d,2)} kg/dm³</b>`;
  let A = NaN, desc = "";
  if(state.shape==="tonda"){ const d=num(v.d); A=Math.PI*d*d/4; desc=`Ø${v.d}`; }
  if(state.shape==="quadra"){ const a=num(v.a); A=a*a; desc=`□${v.a}`; }
  if(state.shape==="piatta"){ const b=num(v.b), s=num(v.s); A=b*s; desc=`${v.b} × ${v.s}`; }
  if(state.shape==="esagono"){ const h=num(v.h); A=Math.sqrt(3)/2*h*h; desc=`ch ${v.h}`; }
  let msg = "Inserisci tutte le quote";
  if(state.shape==="tubo"){
    const D=num(v.D), t=num(v.t);
    if(t*2 >= D){ A=NaN; msg="Lo spessore parete deve essere minore di metà del diametro esterno"; }
    else { const di=D-2*t; A=Math.PI/4*(D*D-di*di); desc=`Ø${v.D} × ${v.t} (Ø int ${nf(di, di%1?1:0)})`; }
  }
  const L = num(v.L), n = Math.max(1, Math.round(num(v.n)) || 1);

  document.querySelectorAll(".field").forEach(f=>{
    const i=f.querySelector("input"); f.classList.toggle("bad", i.value!=="" && isNaN(num(i.value)));
  });

  if(!isFinite(A) || !isFinite(L)){
    $("tot").textContent="–"; $("pz").textContent="–"; $("km").textContent="–"; $("sez").textContent="–"; $("spec").textContent=msg;
    save(); return;
  }
  const kgm = A * 1000 / 1e6 * m.d;          // kg al metro
  const pz  = A * L / 1e6 * m.d;              // kg per pezzo (mm³ → dm³)
  const tot = pz * n;
  const dig = x => x < 1 ? 3 : x < 100 ? 2 : 1;
  $("tot").textContent = nf(tot, dig(tot));
  $("pz").textContent  = nf(pz, dig(pz)) + " kg";
  $("km").textContent  = nf(kgm, dig(kgm)) + " kg/m";
  $("sez").textContent = nf(A, A<100?1:0) + " mm²";
  $("spec").textContent = `${state.shape} ${desc} × ${v.L} mm · ${n} pz · ${m.n.split(" (")[0]}`;
  save();
}

load();
buildSelect();
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click", ()=>setShape(b.dataset.shape)));
setShape(state.shape);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
